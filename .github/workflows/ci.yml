name: CI
on:
  pull_request:
  push: {branches: [main]}
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.11"}
      - run: uv sync --all-extras
      # same entry point as local development, so CI and the Makefile cannot drift
      - run: make check
      - run: uv run pip-audit
  dbt:
    runs-on: ubuntu-latest
    env:
      # dummy values: `dbt parse` validates the project without connecting to Snowflake
      SNOWFLAKE_ACCOUNT: ci
      SNOWFLAKE_USER: ci
      SNOWFLAKE_PASSWORD: ci
      SNOWFLAKE_WAREHOUSE: ci
      SNOWFLAKE_DATABASE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install "dbt-snowflake>=1.8"
      - run: cd dbt && dbt parse
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      # TODO: add `terraform init -backend=false && terraform validate` per env once terraform/modules/postgres exists
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
