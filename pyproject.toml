[project]
name = "llm-assisted-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "snowflake-connector-python>=3.7", "psycopg[binary]>=3.1", "pydantic-settings>=2.16.3",
  "fastapi>=0.110", "uvicorn>=0.29", "dbt-snowflake>=1.8", "apache-airflow>=2.9",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "sqlfluff", "pre-commit", "httpx", "pip-audit"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]
[tool.mypy]
strict = true
ignore_missing_imports = true
[tool.pytest.ini_options]
pythonpath = ["ingestion/src", "api"]
